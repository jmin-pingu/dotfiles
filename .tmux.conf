# enable copy mode
setw -g mode-keys vi

# aggressive resize
set-window-option -g aggressive-resize
set-option -u window-size

# enable vim copy and paste commands in copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# tmux resurrect
set -g @plugin 'tmux-plugins/tmux-resurrect'

# border colors
set -g pane-border-style fg=white
set -g pane-active-border-style "bg=default fg=6"

# clock mode
setw -g clock-mode-colour color1

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=colour14'
set -g status-left ''
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50
set -g status-left-length 10

setw -g window-status-current-style 'fg=colour0 bg=colour2 bold'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=colour14 dim'
setw -g window-status-format ' #[fg=colour14]#I #[fg=colour14]#W #[fg=colour14]#F '

setw -g window-status-bell-style 'fg=colour2 bg=colour1 bold'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
